name: Bug report
description: 报告可复现的问题；不要提交 Cookie、Token 或完整视频内容
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先删除日志中的账号信息、Cookie、Token 和私人路径。
  - type: input
    id: version
    attributes:
      label: bvevidence 版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与工具版本
      description: 操作系统、Python、yt-dlp、FFmpeg 及 faster-whisper 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与已脱敏日志
    validations:
      required: true
